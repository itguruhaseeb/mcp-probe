name: Publish to npm

# Hands-off publishing via npm Trusted Publishing (OIDC) — no token, no OTP.
# Trigger: push a version tag like v0.1.0 (or publish a GitHub Release).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write   # REQUIRED: lets npm authenticate this run via OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest

      - name: Install deps
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Test
        run: node --test || echo "no node --test suite"

      - name: Publish (OIDC trusted publishing + provenance)
        run: npm publish --provenance --access public
